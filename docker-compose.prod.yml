# Production stack: Postgres + FastAPI + Next.js + AI chat assistant behind nginx.
# Copy .env.prod.example to .env and fill it in before running.

services:
  db:
    image: postgres:16-alpine
    container_name: mrwhiz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published to the host: only the backend needs to reach it.
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
    container_name: mrwhiz-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      NEWSLETTER_FROM_EMAIL: ${NEWSLETTER_FROM_EMAIL:-}
      NEWSLETTER_FROM_NAME: ${NEWSLETTER_FROM_NAME:-Mr. Whiz Logistics}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      # AI chat assistant: shared secret for /api/internal/* and the inbox
      # for "call this visitor now" alerts (falls back to ADMIN_EMAIL).
      CHATBOT_SERVICE_TOKEN: ${CHATBOT_SERVICE_TOKEN}
      DISPATCH_ALERT_EMAIL: ${DISPATCH_ALERT_EMAIL:-}
    volumes:
      # Uploaded images must outlive the container.
      - uploads:/app/uploads
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        # Used by the /uploads rewrite, which Next resolves at build time.
        API_INTERNAL_URL: http://backend:8000
    container_name: mrwhiz-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Server Components use the private Docker network instead of making a
      # public round trip through host nginx.
      API_INTERNAL_URL: http://backend:8000
    expose:
      - "3000"

  # AI chat assistant (LangGraph + Groq). Talks to the backend and website
  # over the Docker network; uses its own "chatbot" schema in Postgres.
  chatbot:
    build:
      context: ./chatbot
    container_name: mrwhiz-chatbot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      SERVICE_TOKEN: ${CHATBOT_SERVICE_TOKEN}
      BACKEND_URL: http://backend:8000
      SITE_INTERNAL_URL: http://frontend:3000
      SITE_PUBLIC_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LLM_PROVIDER: ${CHATBOT_LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY}
      CHAT_MODEL: ${CHATBOT_CHAT_MODEL:-llama-3.3-70b-versatile}
      ROUTER_MODEL: ${CHATBOT_ROUTER_MODEL:-llama-3.1-8b-instant}
      FALLBACK_MODEL: ${CHATBOT_FALLBACK_MODEL:-llama-3.1-8b-instant}
      DISPATCH_PHONE: ${CHATBOT_DISPATCH_PHONE:-(469) 767 8853}
      # Optional LangSmith tracing of every conversation.
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-mrwhiz-assistant}
    expose:
      - "8000"
    # Two workers each hold the embedding model (~150 MB) and the index.
    mem_limit: 1536m

  nginx:
    image: nginx:alpine
    container_name: mrwhiz-proxy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - chatbot
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro

volumes:
  pgdata:
  uploads:
